<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Save Study Notes — Plural Compounds</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0A0F1E;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#131C2E;border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.5);}
.icon{font-size:2.8rem;margin-bottom:14px;}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;margin-bottom:6px;}
.sub{font-size:.82rem;color:#64748B;line-height:1.6;margin-bottom:8px;}
.count{font-size:.82rem;color:#3B82F6;font-weight:700;margin-bottom:28px;}
.q-preview{background:#1A2640;border-radius:12px;padding:12px 14px;margin-bottom:24px;text-align:left;max-height:180px;overflow-y:auto;}
.q-preview::-webkit-scrollbar{width:3px;}
.q-preview::-webkit-scrollbar-thumb{background:#3B82F6;border-radius:100px;}
.q-item{font-size:.74rem;color:#94A3B8;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.q-item:last-child{border-bottom:none;}
.q-num{color:#3B82F6;font-weight:700;}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;margin-bottom:12px;transition:all .2s;}
.btn:active{transform:scale(.98);}
.btn:disabled{background:#1A2640;color:#4A5568;cursor:not-allowed;}
.field{width:100%;padding:14px 16px;background:#1A2640;border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;color:#F1F5F9;font-family:inherit;font-size:.9rem;margin-bottom:12px;}
.field::placeholder{color:#4A5568;}
.login-note{font-size:.72rem;color:#4A5568;margin-bottom:16px;line-height:1.5;}
.success{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:14px;padding:20px 16px;}
.success-icon{font-size:2rem;margin-bottom:8px;}
.success-title{font-family:'Syne',sans-serif;font-weight:800;color:#22C55E;font-size:1rem;margin-bottom:6px;}
.success-sub{font-size:.78rem;color:#64748B;line-height:1.6;}
.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:.8rem;color:#EF4444;font-weight:600;}
.retry{background:transparent;border:1.5px solid rgba(255,255,255,0.08);color:#64748B;border-radius:10px;padding:10px 20px;font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">📚</div>
  <div class="title">Plural Compounds</div>
  <div class="sub">Rules for pluralising compound words</div>
  <div class="count" id="countEl">11 rules &amp; tables ready to save</div>

  <div class="q-preview" id="preview"></div>

  <div id="mainArea">
    <div class="login-note">Sign in with your admin account to save — Firestore rules require it.</div>
    <input class="field" id="emailInput" type="email" placeholder="Admin email" autocomplete="username"/>
    <input class="field" id="passInput" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="btn" id="saveBtn" onclick="signInAndSave()">🔐 Sign In &amp; Save to Firestore</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const SUBJECT = 'english';
const ADMIN_UID = 'KNzxKAqIK7bCXX3YbS8oitSr2wh1';
const TOPIC_ID = 'plural-compounds';

const TOPIC = {
  title: "Plural Compounds",
  emoji: "📚",
  order: 5,
  subtopics: [
    {
      subtitle: "Introduction to Compound Words",
      content: [
        "A <b>compound word</b> is defined as one made by the combination of two or more words.",
        "They can be:",
        "a. <b>Written together</b> (e.g., Teacup)",
        "b. <b>Hyphenated</b> (e.g., Bye-law)",
        "c. <b>Separated</b> (e.g., Secretary General)",
        "d. <b>Joined by a preposition</b> (e.g., Head of Department)",
        "These words are made by the various types of combinations among nouns, adjectives, or prepositions.",
        "<u>Identifying compound words is one thing and knowing how they are pluralised is a different thing entirely.</u> It is this knowledge most examination bodies cash in on to reduce the marks of unprepared candidates.",
        "There are <b>three different ways</b> of pluralising compound words:",
        "1. <b>Pluralising the first word</b>",
        "2. <b>Pluralising the last word</b>",
        "3. <b>Pluralising both words</b>"
      ],
      example: null
    },
    {
      subtitle: "1. Pluralising the First Word",
      content: [
        "<b>Examples:</b>",
        "Accountant-General → <b>Accountants-General</b>",
        "Secretary-General → <b>Secretaries-General</b>",
        "Attorney-General → <b>Attorneys-General</b>",
        "Justice-of-the-peace → <b>Justices-of-the-peace</b>",
        "Grant-in-aid → <b>Grants-in-aid</b>",
        "Man-of-war → <b>Men-of-war</b>",
        "Son-in-law → <b>Sons-in-law</b>",
        "Daughter-in-law → <b>Daughters-in-law</b>",
        "Sister-in-law → <b>Sisters-in-law</b>",
        "Father-in-law → <b>Fathers-in-law</b>",
        "Mother-in-law → <b>Mothers-in-law</b>",
        "Auditor-General → <b>Auditors-General</b>",
        "Chief-of-Staff → <b>Chiefs-of-Staff</b>",
        "Court-Martial → <b>Courts-Martial</b>",
        "Editor-in-Chief → <b>Editors-in-Chief</b>",
        "Notary Public → <b>Notaries Public</b>",
        "Governor-General → <b>Governors-General</b>",
        "Commander-in-chief → <b>Commanders-in-chief</b>",
        "Director-General → <b>Directors-General</b>",
        "Passer-by → <b>Passers-by</b>",
        "Head of Department → <b>Heads of Department</b>"
      ],
      example: null
    },
    {
      subtitle: "2. Pluralising the Last Word",
      content: [
        "<b>Examples:</b>",
        "Major General → <b>Major Generals</b>",
        "Lady Driver → <b>Lady Drivers</b>",
        "Workman → <b>Workmen</b>",
        "Male Student → <b>Male Students</b>",
        "Bookcase → <b>Bookcases</b>",
        "Girlfriend → <b>Girlfriends</b>",
        "Call girl → <b>Call girls</b>",
        "Bye-Election → <b>Bye-Elections</b>",
        "Financial Secretary → <b>Financial Secretaries</b>",
        "Take-off → <b>Take-offs</b>",
        "Play Boy → <b>Play Boys</b>",
        "Gin-and-tonic → <b>Gin-and-tonics</b>",
        "Bread-crumb → <b>Bread crumbs</b>",
        "Boy Brigade → <b>Boy Brigades</b>",
        "Bookcase → <b>Bookcases</b>",
        "Classroom → <b>Classrooms</b>",
        "Out-goer → <b>Out-goers</b>",
        "Bystander → <b>Bystanders</b>",
        "Spoonful → <b>Spoonfuls</b>",
        "Cupful → <b>Cupfuls</b>",
        "Basketball → <b>Basketballs</b>",
        "Dining Hall → <b>Dining Halls</b>",
        "Face-clothe → <b>Face-clothes</b>",
        "Surgeon-Major → <b>Surgeon-Majors</b>",
        "Forget-me-not → <b>Forget-me-nots</b>",
        "Boy-scout → <b>Boy-scouts</b>",
        "Fountain pen → <b>Fountain pens</b>",
        "Deaf-mute → <b>Deaf-mutes</b>",
        "Factory-worker → <b>Factory workers</b>",
        "Incomer → <b>Incomers</b>",
        "Onlooker → <b>Onlookers</b>",
        "Breakdown → <b>Breakdowns</b>",
        "Post office → <b>Post offices</b>",
        "Grownup → <b>Grownups</b>",
        "Sign-manual → <b>Sign-manuals</b>",
        "Call driver → <b>Call drivers</b>",
        "Bitter-sweet → <b>Bitter-sweets</b>",
        "Adding-machine → <b>Adding-machines</b>",
        "Shirtsleeve → <b>Shirtsleeves</b>",
        "Fire-engine → <b>Fire-engines</b>"
      ],
      example: null
    },
    {
      subtitle: "3. Pluralising Both Words",
      content: [
        "<b>Examples:</b>",
        "Man servant → <b>Men servants</b>",
        "Woman pilot → <b>Women pilots</b>",
        "Man friend → <b>Men friends</b>",
        "Woman doctor → <b>Women doctors</b>",
        "Gentleman farmer → <b>Gentlemen farmers</b>",
        "Lord-Justice → <b>Lords-Justices</b>",
        "Lord-Lieutenant → <b>Lords-Lieutenants</b>",
        "Man Student → <b>Men Students</b>",
        "Woman driver → <b>Women drivers</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 1: Some compound words do not take any new plural form",
      content: [
        "Tissue paper → <b>Tissue paper</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 2: When a noun describes another noun",
      content: [
        "It is only the <b>noun being described</b> that should be pluralised.",
        "Here the first noun acts as an <b>adjective</b>.",
        "Woman affair → <b>Woman affairs</b> (e.g., Ministry of Woman Affairs)",
        "Student affair → <b>Student affairs</b> (e.g., Student Affairs Office)",
        "Parent-Teacher association → <b>Parent-Teacher associations</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 3: When a compound noun ends with 'ful'",
      content: [
        "The <b>'s'</b> is added <b>after</b> the 'ful', except you are given options with none having 's' after 'ful', then you pick the one with 's' before 'ful'.",
        "Spoonfuls (great/very good)",
        "Spoonful (okay/good)"
      ],
      example: null
    },
    {
      subtitle: "Rule 4: Noun + preposition + another noun formula",
      content: [
        "In a compound noun with <b>noun + preposition + another noun</b> formula, the <b>first noun</b> should be pluralised.",
        "Man of war → <b>Men of war</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 5: When male or female is compounded with another noun",
      content: [
        "It is the <b>noun</b> (not the male or female) that should be pluralised.",
        "Female soldier → <b>Female soldiers</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 6: When a noun describes another noun",
      content: [
        "It is the <b>other noun</b> that is pluralised.",
        "Boy-scout → <b>Boy-scouts</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 7: When a verb is compounded with another part of speech",
      content: [
        "It is the <b>other part of speech</b> that should be pluralised.",
        "Grown-up → <b>Grown-ups</b>"
      ],
      example: null
    },
    {
      subtitle: "Rule 8: When an adjective and a noun makes up a compound word",
      content: [
        "It is the <b>noun</b> (not the adjective) that should be pluralised.",
        "Chief-of-staff → <b>Chiefs-of-staff</b>"
      ],
      example: null
    }
  ]
};

const firebaseConfig = {
  apiKey: "AIzaSyA8vqQqgQYzSX5qagQz1_8BB87xURMsgPE",
  authDomain: "aceunilorin-pq.firebaseapp.com",
  projectId: "aceunilorin-pq",
  storageBucket: "aceunilorin-pq.firebasestorage.app",
  messagingSenderId: "152163357125",
  appId: "1:152163357125:web:23dc8652f9789197623bac"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const prev = document.getElementById('preview');
prev.innerHTML = TOPIC.subtopics.map((s,i) =>
  `<div class="q-item"><span class="q-num">${i+1}.</span> ${s.subtitle}</div>`
).join('');

async function fsSet(col, docId, data, attempt = 1) {
  try {
    await db.collection(col).doc(docId).set({...data, updatedAt: new Date().toISOString()}, {merge: true});
  } catch (err) {
    const isNetworkError = err.code === 'unavailable' || err instanceof TypeError;
    if (isNetworkError && attempt < 3) {
      await new Promise(res => setTimeout(res, attempt * 1000));
      return fsSet(col, docId, data, attempt + 1);
    }
    throw err;
  }
}

async function signInAndSave() {
  const btn = document.getElementById('saveBtn');
  const area = document.getElementById('mainArea');
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;

  if (!email || !password) {
    alert('Enter your admin email and password first.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '🔐 Signing in...';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    if (cred.user.uid !== ADMIN_UID) {
      area.innerHTML = `
        <div class="error">🚫 Signed in, but this account is not the admin account. Nothing was saved.</div>
        <button class="retry" onclick="location.reload()">Try again</button>`;
      return;
    }
  } catch (err) {
    area.innerHTML = `
      <div class="error">🚫 Sign-in failed: ${err.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  try {
    await fsSet(`studynotes/${SUBJECT}/topics`, TOPIC_ID, TOPIC);
    document.getElementById('mainArea').innerHTML = `
      <div class="success">
        <div class="success-icon">🎉</div>
        <div class="success-title">Topic saved!</div>
        <div class="success-sub">"${TOPIC.title}" is now live under studynotes/${SUBJECT}/topics/${TOPIC_ID}, with ${TOPIC.subtopics.length} sub-sections.</div>
      </div>`;
  } catch (e) {
    document.getElementById('mainArea').innerHTML = `
      <div class="error">❌ Failed to save: ${e.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
  }
}
</script>
</body>
</html>
