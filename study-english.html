<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Use of English — AceUnilorin PQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root[data-theme="dark"]{--bg:#0F172A;--surface:#1E293B;--surface2:#253147;--primary:#14B8A6;--primary-glow:rgba(20,184,166,0.15);--text:#F1F5F9;--text-muted:#94A3B8;--border:rgba(255,255,255,0.07);--card-shadow:0 4px 32px rgba(0,0,0,0.4);}
    :root[data-theme="light"]{--bg:#F0FDF9;--surface:#FFFFFF;--surface2:#CCFBF1;--primary:#0D9488;--primary-glow:rgba(13,148,136,0.1);--text:#134E4A;--text-muted:#6B7280;--border:rgba(0,0,0,0.07);--card-shadow:0 4px 32px rgba(13,148,136,0.08);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;transition:background 0.3s,color 0.3s;}
    .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:0.08;pointer-events:none;z-index:0;}
    .blob-1{width:450px;height:450px;background:#14B8A6;top:-100px;right:-80px;}
    .blob-2{width:300px;height:300px;background:#06B6D4;bottom:80px;left:-60px;}
    nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(15,23,42,0.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);}
    [data-theme="light"] nav{background:rgba(240,253,249,0.88);}
    .nav-logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--primary);text-decoration:none;}
    .nav-logo span{color:var(--text);}
    .theme-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
    .content{max-width:560px;margin:0 auto;padding:28px 20px;position:relative;z-index:1;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:0.85rem;text-decoration:none;margin-bottom:16px;}
    .back-link:hover{color:var(--primary);}
    .subject-hero{display:flex;align-items:center;gap:16px;margin-bottom:28px;animation:fadeUp 0.5s ease both;}
    .hero-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#14B8A6,#06B6D4);display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 8px 24px rgba(20,184,166,0.3);flex-shrink:0;}
    .hero-text h1{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-0.5px;}
    .hero-text p{font-size:0.82rem;color:var(--text-muted);margin-top:3px;}

    /* NOTES */
    .notes-loading{text-align:center;padding:40px 20px;color:var(--text-muted);}
    .spinner{width:30px;height:30px;border:3px solid var(--surface2);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
    .notes-empty{text-align:center;padding:40px 20px;}
    .notes-empty .empty-icon{font-size:2.5rem;margin-bottom:12px;}
    .notes-empty p{color:var(--text-muted);font-size:0.88rem;line-height:1.6;}

    .topic-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--card-shadow);}
    .topic-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;user-select:none;transition:background 0.2s;}
    .topic-header:hover{background:var(--surface2);}
    .topic-header-left{display:flex;align-items:center;gap:12px;}
    .topic-emoji{font-size:1.2rem;}
    .topic-title{font-family:'Times New Roman',Times,serif;font-size:0.98rem;font-weight:700;}
    .topic-chevron{font-size:0.75rem;color:var(--text-muted);transition:transform 0.25s;flex-shrink:0;}
    .topic-card.open .topic-chevron{transform:rotate(180deg);}
    .topic-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border);}
    .topic-card.open .topic-body{display:block;animation:fadeUp 0.25s ease both;}
    .subtopic-block{margin-top:16px;}
    .subtopic-block:first-child{margin-top:14px;}
    .subtopic-title{font-family:'Times New Roman',Times,serif;font-size:0.9rem;font-weight:700;color:var(--primary);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--border);}
    .topic-body ul{padding-left:18px;margin-top:8px;}
    .topic-body li{font-family:'Times New Roman',Times,serif;font-size:0.92rem;color:var(--text-muted);line-height:1.75;margin-bottom:3px;}
    .example-box{background:var(--surface2);border-left:3px solid var(--primary);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:10px;font-family:'Times New Roman',Times,serif;font-size:0.9rem;line-height:1.6;color:var(--text-muted);}
    .example-box strong{color:var(--primary);}
    .topic-quiz-btn{width:100%;margin-top:18px;padding:13px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;}
    .topic-quiz-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow);}
    .topic-quiz-btn .qcount{opacity:0.85;font-weight:500;}
    .topic-video-btn{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:all 0.2s;}
    .topic-video-btn:hover{border-color:#EF4444;color:#EF4444;}

    /* QUIZ ENGINE (shared, scoped to whichever topic was clicked) */
    .quiz-overlay{display:none;margin-top:12px;}
    .quiz-overlay.active{display:block;animation:fadeUp 0.3s ease both;}
    .quiz-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--card-shadow);}
    .quiz-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .quiz-panel-title{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800;}
    .quiz-close{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;line-height:1;}
    .qpb-wrap{margin-bottom:16px;}
    .qpb-bg{background:var(--surface2);border-radius:100px;height:5px;overflow:hidden;}
    .qpb-fill{height:100%;background:linear-gradient(90deg,#14B8A6,#06B6D4);border-radius:100px;transition:width 0.3s;}
    .qpb-label{font-size:0.7rem;color:var(--text-muted);margin-top:4px;text-align:right;}
    .q-counter{font-size:0.75rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .q-text{font-size:0.98rem;font-weight:600;line-height:1.65;margin-bottom:20px;}
    .options{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
    .option{background:var(--bg);border:2px solid var(--border);border-radius:13px;padding:12px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s;}
    .option:hover{border-color:var(--primary);background:var(--primary-glow);}
    .option.selected{border-color:var(--primary);background:var(--primary-glow);}
    .option-letter{width:30px;height:30px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:800;flex-shrink:0;transition:all 0.2s;}
    .option.selected .option-letter{background:var(--primary);color:#fff;}
    .option-text{font-size:0.88rem;line-height:1.4;}
    .quiz-nav{display:flex;gap:10px;margin-bottom:6px;}
    .nav-btn{flex:1;padding:12px;border-radius:11px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.88rem;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
    .nav-btn:hover{border-color:var(--primary);color:var(--primary);}
    .nav-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .nav-btn.submit-btn{background:var(--primary);color:#fff;border-color:var(--primary);}
    .loading-state{text-align:center;padding:32px;color:var(--text-muted);}
    .btn{padding:13px 24px;border-radius:13px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;border:none;transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow);}
    .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);}
    .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
    .batch-result{display:none;}
    .batch-result.active{display:block;animation:fadeUp 0.3s ease both;}
    .batch-score{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;text-align:center;margin-bottom:4px;}
    .batch-label{font-size:0.85rem;color:var(--text-muted);text-align:center;margin-bottom:18px;}
    .batch-review{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
    .br-card{background:var(--surface2);border-radius:12px;padding:13px 15px;border-left:3px solid #94A3B8;}
    .br-card.correct{border-left-color:#22C55E;}
    .br-card.wrong{border-left-color:#EF4444;}
    .br-card.skipped{border-left-color:#F59E0B;}
    .br-q{font-size:0.82rem;font-weight:600;margin-bottom:6px;line-height:1.4;}
    .br-ans{font-size:0.78rem;color:var(--text-muted);margin-bottom:2px;}
    .br-ans .c{color:#22C55E;font-weight:700;}
    .br-ans .w{color:#EF4444;font-weight:700;}
    .br-exp{font-size:0.75rem;color:var(--text-muted);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
    .batch-btns{display:flex;flex-direction:column;gap:8px;}
    .index-warning{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:12px 14px;font-size:0.78rem;color:#F59E0B;line-height:1.6;}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(15,23,42,0.92);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:10px 0 14px;}
    [data-theme="light"] .bottom-nav{background:rgba(240,253,249,0.92);}
    .bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--text-muted);font-size:0.62rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:0 14px;}
    .bnav-item.active{color:var(--primary);}
    .bnav-icon{font-size:1.2rem;}

    /* ARRAY-STYLE QUIZ (all questions at once, like mocks/past questions) */
    .quiz-list{display:flex;flex-direction:column;gap:18px;margin-bottom:18px;}
    .quiz-item{padding-bottom:16px;border-bottom:1px solid var(--border);}
    .quiz-item:last-child{border-bottom:none;padding-bottom:0;}
    .quiz-item .q-counter{margin-bottom:6px;}
    .quiz-item .q-text{margin-bottom:14px;}
    .quiz-item .options{margin-bottom:0;}
    .quiz-submit-wrap{margin-top:4px;}
    .unanswered-note{font-size:0.74rem;color:#F59E0B;text-align:center;margin-bottom:12px;}

    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>
<nav>
  <a href="study.html" class="nav-logo">Ace<span>Unilorin</span> PQ</a>
  <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
</nav>
<div class="content">
  <a href="study.html" class="back-link">← Back to Study Hub</a>
  <div class="subject-hero">
    <div class="hero-icon">📖</div>
    <div class="hero-text"><h1>Use of English</h1><p>Notes + Practice Questions, by topic</p></div>
  </div>

  <div id="notesContainer">
    <div class="notes-loading"><div class="spinner"></div>Loading notes...</div>
  </div>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="bnav-item"><span class="bnav-icon">🏠</span>Home</a>
  <a href="pastquestions.html" class="bnav-item"><span class="bnav-icon">📝</span>Past Q</a>
  <a href="mock.html" class="bnav-item"><span class="bnav-icon">⏱️</span>Mock</a>
  <a href="study.html" class="bnav-item active"><span class="bnav-icon">📚</span>Study</a>
  <a href="leaderboard.html" class="bnav-item"><span class="bnav-icon">🏆</span>Ranks</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig={apiKey:"AIzaSyA8vqQqgQYzSX5qagQz1_8BB87xURMsgPE",authDomain:"aceunilorin-pq.firebaseapp.com",projectId:"aceunilorin-pq",storageBucket:"aceunilorin-pq.firebasestorage.app",messagingSenderId:"152163357125",appId:"1:152163357125:web:23dc8652f9789197623bac"};
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(), db=firebase.firestore();
  const SUBJECT='english', BATCH=10;
  let questions=[],userAnswers={},lastDoc=null,hasMore=true,uid=null;
  let currentTopicId=null, currentTopicQuestionCount=0;

  function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.querySelector('.theme-toggle').textContent=d?'🌙':'☀️';localStorage.setItem('theme',d?'light':'dark');}
  const saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);document.querySelector('.theme-toggle').textContent=saved==='dark'?'☀️':'🌙';

  auth.onAuthStateChanged(u=>{if(!u){window.location.href='auth.html';return;}uid=u.uid;loadNotes();});

  // ── NOTES ──
  async function loadNotes(){
    const container=document.getElementById('notesContainer');
    try{
      const snap=await db.collection('studynotes').doc(SUBJECT)
        .collection('topics').orderBy('order').get();
      if(snap.empty){
        container.innerHTML=`<div class="notes-empty"><div class="empty-icon">📭</div><p>No notes added yet for this subject.<br>Check back soon!</p></div>`;
        return;
      }
      container.innerHTML='';
      for(const doc of snap.docs){
        const t=doc.data();
        const topicId=doc.id;

        // Count questions tagged to this topic so the button can show "(N questions)"
        let qCount=0;
        try{
          const qSnap=await db.collection('studyquestions').doc(SUBJECT).collection('questions')
            .where('topicId','==',topicId).get();
          qCount=qSnap.size;
        }catch(e){ /* index may not exist yet for equality-only count; ignore */ }

        let bodyHtml='';
        if(Array.isArray(t.subtopics)&&t.subtopics.length){
          // Multi-section topic
          bodyHtml=t.subtopics.map(s=>{
            const points=(s.content||[]).map(p=>`<li>${p}</li>`).join('');
            const example=s.example?`<div class="example-box"><strong>💡 Note:</strong> ${s.example}</div>`:'';
            return `<div class="subtopic-block"><div class="subtopic-title">${s.subtitle||''}</div><ul>${points}</ul>${example}</div>`;
          }).join('');
        } else {
          // Single flat-content topic (legacy / simple shape)
          const points=(t.content||[]).map(p=>`<li>${p}</li>`).join('');
          const example=t.example?`<div class="example-box"><strong>💡 Note:</strong> ${t.example}</div>`:'';
          bodyHtml=`<ul>${points}</ul>${example}`;
        }

        const quizBtn=qCount>0
          ? `<button class="topic-quiz-btn" onclick="event.stopPropagation();openTopicQuiz('${topicId}', this)">🧠 Take Quiz on This Topic <span class="qcount">(${qCount} question${qCount===1?'':'s'})</span></button>`
          : '';

        const videoBtn=t.videoUrl
          ? `<a class="topic-video-btn" href="${t.videoUrl}" target="_blank" onclick="event.stopPropagation()">▶️ Watch Video</a>`
          : '';

        container.innerHTML+=`
          <div class="topic-card" data-topic-id="${topicId}">
            <div class="topic-header" onclick="this.parentElement.classList.toggle('open')">
              <div class="topic-header-left">
                <span class="topic-emoji">${t.emoji||'📌'}</span>
                <span class="topic-title">${t.title}</span>
              </div>
              <span class="topic-chevron">▼</span>
            </div>
            <div class="topic-body">
              ${bodyHtml}
              ${videoBtn}
              ${quizBtn}
              <div class="quiz-overlay" id="quizOverlay-${topicId}"></div>
            </div>
          </div>`;
      }
    }catch(e){
      container.innerHTML=`<div class="notes-empty"><div class="empty-icon">⚠️</div><p>Failed to load notes. Check your connection.</p></div>`;
      console.error(e);
    }
  }

  // ── TOPIC-SCOPED QUIZ ──
  function quizPanelShell(topicId){
    return `
      <div class="quiz-panel">
        <div class="quiz-panel-header">
          <div class="quiz-panel-title">🧠 Topic Quiz</div>
          <button class="quiz-close" onclick="closeTopicQuiz('${topicId}')">✕</button>
        </div>
        <div id="quizEngine-${topicId}"></div>
        <div class="batch-result" id="batchResult-${topicId}"></div>
      </div>`;
  }

  async function openTopicQuiz(topicId, btnEl){
    currentTopicId=topicId;
    const overlay=document.getElementById('quizOverlay-'+topicId);
    overlay.innerHTML=quizPanelShell(topicId);
    overlay.classList.add('active');
    btnEl.style.display='none';
    lastDoc=null; hasMore=true;
    await loadBatch(topicId);
    overlay.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function closeTopicQuiz(topicId){
    const overlay=document.getElementById('quizOverlay-'+topicId);
    overlay.classList.remove('active');
    overlay.innerHTML='';
    const card=overlay.closest('.topic-card');
    const btn=card.querySelector('.topic-quiz-btn');
    if(btn) btn.style.display='flex';
  }

  async function loadBatch(topicId){
    const engine=document.getElementById('quizEngine-'+topicId);
    engine.innerHTML=`<div class="loading-state"><div class="spinner"></div><div>Loading questions...</div></div>`;
    try{
      let q=db.collection('studyquestions').doc(SUBJECT).collection('questions')
        .where('topicId','==',topicId).orderBy('number').limit(BATCH);
      if(lastDoc) q=q.startAfter(lastDoc);
      const snap=await q.get();
      if(snap.empty||snap.docs.length<BATCH) hasMore=false;
      if(snap.empty){ showTopicDone(topicId); return; }
      lastDoc=snap.docs[snap.docs.length-1];
      questions=snap.docs.map(d=>({...d.data(),id:d.id}));
      userAnswers={};
      renderQuestionList(topicId);
    }catch(e){
      console.error(e);
      let hint='';
      if(e.code==='failed-precondition' || (e.message&&e.message.includes('index'))){
        const urlMatch = e.message && e.message.match(/https?:\/\/\S+/);
        const linkHtml = urlMatch
          ? `<a href="${urlMatch[0]}" target="_blank" style="color:#F59E0B;text-decoration:underline;word-break:break-all;">${urlMatch[0]}</a>`
          : `<span style="word-break:break-all;font-size:0.72rem;">${e.message}</span>`;
        hint=`<div class="index-warning">⚠️ Firestore needs a one-time index for this. Tap the link below — it'll auto-create the index (takes about a minute to finish building), then come back and try again.<br><br>${linkHtml}</div>`;
      }
      engine.innerHTML=`<div class="loading-state">Failed to load questions.${hint}</div>`;
    }
  }

  // Renders ALL questions in the batch at once, array-style (matches mocks/past questions)
  function renderQuestionList(topicId){
    const engine=document.getElementById('quizEngine-'+topicId);
    const total=questions.length;

    const itemsHtml=questions.map((q,i)=>{
      const opts=['A','B','C','D','E'].map((l,k)=>{
        const opt=[q.optionA,q.optionB,q.optionC,q.optionD,q.optionE][k];
        if(!opt) return '';
        const sel=userAnswers[i]===l?' selected':'';
        return `<div class="option${sel}" onclick="selectAnswer('${topicId}',${i},'${l}')"><div class="option-letter">${l}</div><div class="option-text">${opt}</div></div>`;
      }).join('');

      return `
        <div class="quiz-item">
          <div class="q-counter">Question ${i+1} of ${total}</div>
          <div class="q-text">${q.question||q.text||''}</div>
          <div class="options" id="opts-${topicId}-${i}">${opts}</div>
        </div>`;
    }).join('');

    engine.innerHTML=`
      <div class="quiz-list">${itemsHtml}</div>
      <div class="quiz-submit-wrap">
        <button class="nav-btn submit-btn" style="width:100%;" onclick="submitBatch('${topicId}')">Submit ✓</button>
      </div>`;
  }

  // Re-renders just one question's options (so we don't rebuild the whole list on every tap)
  function selectAnswer(topicId,i,l){
    userAnswers[i]=l;
    const q=questions[i];
    const optsHtml=['A','B','C','D','E'].map((letter,k)=>{
      const opt=[q.optionA,q.optionB,q.optionC,q.optionD,q.optionE][k];
      if(!opt) return '';
      const sel=userAnswers[i]===letter?' selected':'';
      return `<div class="option${sel}" onclick="selectAnswer('${topicId}',${i},'${letter}')"><div class="option-letter">${letter}</div><div class="option-text">${opt}</div></div>`;
    }).join('');
    document.getElementById(`opts-${topicId}-${i}`).innerHTML=optsHtml;
  }

  function submitBatch(topicId){
    let correct=0;const review=[];
    questions.forEach((q,i)=>{
      const ua=userAnswers[i]||null,ca=q.answer||q.correctAnswer;
      let status='skipped';
      if(ua){if(ua===ca){correct++;status='correct';}else status='wrong';}
      review.push({...q,userAnswer:ua,status});
    });
    if(uid){
      const key=`studyProgress_${uid}_${SUBJECT}`;
      const raw=localStorage.getItem(key);
      let done=correct,total=questions.length;
      if(raw){const d=JSON.parse(raw);done=d.done+correct;total=d.total+questions.length;}
      localStorage.setItem(key,JSON.stringify({done,total}));
      const sk=`studyStreak_${uid}`,today=new Date().toDateString(),yesterday=new Date(Date.now()-86400000).toDateString();
      const sr=localStorage.getItem(sk);let count=1;
      if(sr){const d=JSON.parse(sr);if(d.lastDate===today)count=d.count;else if(d.lastDate===yesterday)count=d.count+1;}
      localStorage.setItem(sk,JSON.stringify({count,lastDate:today}));
    }
    document.getElementById('quizEngine-'+topicId).innerHTML='';
    const br=document.getElementById('batchResult-'+topicId);
    br.classList.add('active');
    const pct=Math.round((correct/questions.length)*100);
    const letters=['A','B','C','D','E'];
    const reviewHtml=review.map((q,i)=>{
      const opts=[q.optionA,q.optionB,q.optionC,q.optionD,q.optionE];
      const ca=q.answer||q.correctAnswer;
      const correctOpt=opts[letters.indexOf(ca)]||'';
      const userOpt=q.userAnswer?opts[letters.indexOf(q.userAnswer)]||'':'';
      return`<div class="br-card ${q.status}">
        <div class="br-q">${q.status==='correct'?'✅':q.status==='wrong'?'❌':'⏭️'} Q${i+1}: ${q.question||q.text}</div>
        <div class="br-ans">Correct: <span class="c">${ca} — ${correctOpt}</span></div>
        ${q.userAnswer&&q.status==='wrong'?`<div class="br-ans">Your answer: <span class="w">${q.userAnswer} — ${userOpt}</span></div>`:''}
        ${q.status==='skipped'?'<div class="br-ans" style="color:#F59E0B">Not answered</div>':''}
        ${q.explanation?`<div class="br-exp">💡 ${q.explanation}</div>`:''}
      </div>`;
    }).join('');
    br.innerHTML=`
      <div class="batch-score">${correct}/${questions.length}</div>
      <div class="batch-label">${pct===100?'Perfect! 🎉':pct>=80?'Excellent! 🔥':pct>=60?'Good effort 👍':pct>=40?'Keep practising 💪':'Review the notes and try again 📖'}</div>
      <div class="batch-review">${reviewHtml}</div>
      <div class="batch-btns">
        <button class="btn btn-primary" onclick="nextTopicBatch('${topicId}')">${hasMore?('Next '+BATCH+' Questions →'):'🔁 Restart Topic Quiz'}</button>
        <button class="btn btn-outline" onclick="closeTopicQuiz('${topicId}')">Close</button>
      </div>`;
  }

  async function nextTopicBatch(topicId){
    document.getElementById('batchResult-'+topicId).classList.remove('active');
    document.getElementById('batchResult-'+topicId).innerHTML='';
    if(!hasMore){ lastDoc=null; hasMore=true; }
    await loadBatch(topicId);
  }

  function showTopicDone(topicId){
    const engine=document.getElementById('quizEngine-'+topicId);
    engine.innerHTML=`
      <div class="loading-state">
        <div style="font-size:2.4rem;margin-bottom:10px;">🎉</div>
        <div style="font-weight:700;color:var(--text);margin-bottom:6px;">All questions done!</div>
        <div style="margin-bottom:16px;">You've completed every question for this topic.</div>
        <button class="btn btn-primary" onclick="restartTopicQuiz('${topicId}')">🔁 Start Over</button>
      </div>`;
  }

  async function restartTopicQuiz(topicId){
    lastDoc=null; hasMore=true;
    await loadBatch(topicId);
  }
</script>
</body>
</html>
