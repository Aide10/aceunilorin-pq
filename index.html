<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AceUnilorin PQ — Study Smart. Pass Well.</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root[data-theme="dark"]{--bg:#0F172A;--surface:#1E293B;--surface2:#253147;--primary:#3B82F6;--primary-glow:rgba(59,130,246,0.18);--text:#F1F5F9;--text-muted:#94A3B8;--border:rgba(255,255,255,0.07);--card-shadow:0 4px 32px rgba(0,0,0,0.4);}
    :root[data-theme="light"]{--bg:#F0F4FF;--surface:#FFFFFF;--surface2:#E8EFFF;--primary:#2563EB;--primary-glow:rgba(37,99,235,0.12);--text:#1E293B;--text-muted:#64748B;--border:rgba(0,0,0,0.07);--card-shadow:0 4px 32px rgba(37,99,235,0.08);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;overflow-x:hidden;}
    .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.18;pointer-events:none;z-index:0;}
    .blob-1{width:480px;height:480px;background:#3B82F6;top:-120px;right:-100px;}
    .blob-2{width:360px;height:360px;background:#6366F1;bottom:0;left:-80px;}
    nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(15,23,42,0.7);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:background 0.3s;}
    [data-theme="light"] nav{background:rgba(240,244,255,0.8);}
    .nav-logo{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;color:var(--primary);letter-spacing:-0.5px;}
    .nav-logo span{color:var(--text);}
    .nav-right{display:flex;align-items:center;gap:12px;}
    .theme-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.2s;}
    .theme-toggle:hover{transform:scale(1.1);}
    .btn{padding:10px 22px;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.9rem;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
    .btn-outline:hover{background:var(--primary-glow);}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 16px var(--primary-glow);}
    .btn-primary:hover{transform:translateY(-2px);}
    .hero{position:relative;z-index:1;padding:72px 24px 56px;text-align:center;max-width:680px;margin:0 auto;}
    .badge{display:inline-flex;align-items:center;gap:8px;background:var(--primary-glow);border:1px solid rgba(59,130,246,0.3);color:var(--primary);padding:6px 16px;border-radius:100px;font-size:0.8rem;font-weight:600;margin-bottom:24px;}
    .badge-dot{width:7px;height:7px;background:var(--primary);border-radius:50%;animation:pulse 1.5s infinite;}
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(2.4rem,8vw,3.8rem);font-weight:800;line-height:1.1;letter-spacing:-1.5px;margin-bottom:20px;}
    .hero h1 .accent{color:var(--primary);}
    .hero p{font-size:1.05rem;color:var(--text-muted);line-height:1.7;margin-bottom:36px;}
    .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .hero-btns .btn{padding:14px 28px;font-size:1rem;border-radius:12px;}
    .stats{position:relative;z-index:1;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 24px 56px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 28px;text-align:center;min-width:130px;box-shadow:var(--card-shadow);transition:transform 0.2s;}
    .stat-card:hover{transform:translateY(-4px);}
    .stat-num{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--text);}
    .stat-label{font-size:0.78rem;color:var(--text-muted);margin-top:4px;font-weight:500;}
    .copy-section{position:relative;z-index:1;max-width:720px;margin:0 auto 64px;padding:0 24px;}
    .copy-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 36px;box-shadow:var(--card-shadow);position:relative;overflow:hidden;}
    .copy-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#6366F1,var(--primary));background-size:200% 100%;animation:shimmer 3s linear infinite;}
    .copy-eyebrow{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--primary);margin-bottom:16px;}
    .copy-headline{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;line-height:1.2;letter-spacing:-0.5px;margin-bottom:20px;color:var(--text);}
    .copy-body{font-size:0.95rem;color:var(--text-muted);line-height:1.8;margin-bottom:20px;}
    .copy-body strong{color:var(--text);font-weight:700;}
    .copy-results{background:var(--surface2);border-radius:14px;padding:20px 24px;margin:24px 0;border:1px solid var(--border);}
    .copy-result-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.88rem;color:var(--text-muted);line-height:1.5;}
    .copy-result-item:last-child{border-bottom:none;}
    .copy-result-item strong{color:var(--text);font-weight:700;}
    .copy-quote{font-style:italic;font-size:0.88rem;color:var(--text-muted);border-left:3px solid var(--primary);padding-left:16px;margin:24px 0;line-height:1.7;}
    .copy-quote cite{display:block;margin-top:8px;font-style:normal;font-weight:700;font-size:0.78rem;color:var(--primary);}
    .copy-cta-wrap{margin-top:28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
    .copy-cta-btn{display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:#fff;padding:15px 28px;border-radius:12px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;text-decoration:none;transition:all 0.2s;box-shadow:0 4px 20px var(--primary-glow);}
    .copy-cta-btn:hover{transform:translateY(-2px);}
    .copy-cta-note{font-size:0.75rem;color:var(--text-muted);}
    .copy-price-highlight{display:inline-block;background:var(--primary-glow);border:1px solid rgba(59,130,246,0.3);color:var(--primary);font-weight:800;font-family:'Syne',sans-serif;padding:3px 10px;border-radius:6px;font-size:1rem;}
    .section{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 24px 64px;}
    .section-title{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px;}
    .section-sub{color:var(--text-muted);font-size:0.95rem;margin-bottom:32px;}
    .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
    .feature-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--card-shadow);transition:transform 0.2s,border-color 0.2s;}
    .feature-card:hover{transform:translateY(-4px);border-color:var(--primary);}
    .feature-icon{width:48px;height:48px;background:var(--primary-glow);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:16px;}
    .feature-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:8px;}
    .feature-card p{font-size:0.88rem;color:var(--text-muted);line-height:1.6;}
    .cta-section{position:relative;z-index:1;background:var(--primary);border-radius:24px;padding:48px 32px;text-align:center;overflow:hidden;max-width:852px;margin:0 auto 64px;}
    .cta-section h2{font-family:'Syne',sans-serif;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;color:#fff;margin-bottom:12px;}
    .cta-section p{color:rgba(255,255,255,0.8);margin-bottom:28px;font-size:0.95rem;}
    .btn-white{background:#fff;color:var(--primary);font-weight:700;padding:14px 32px;border-radius:12px;font-size:1rem;}
    .btn-white:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2);}
    footer{position:relative;z-index:1;text-align:center;padding:24px;border-top:1px solid var(--border);color:var(--text-muted);font-size:0.82rem;}
    footer span{color:var(--primary);font-weight:600;}
    @keyframes shimmer{to{background-position:200% 0;}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
    @media(max-width:480px){
      nav{padding:12px 16px;}.nav-logo{font-size:1rem;}.btn{padding:8px 14px;font-size:0.82rem;}.nav-right{gap:8px;}
      .hero{padding:48px 16px 40px;}.stats{gap:8px;padding:0 16px 40px;}.stat-card{min-width:100px;padding:16px;}
      .features-grid{grid-template-columns:1fr;}.cta-section{padding:36px 20px;}
      .copy-card{padding:28px 20px;}.copy-cta-btn{width:100%;justify-content:center;}
    }
  </style>
</head>
