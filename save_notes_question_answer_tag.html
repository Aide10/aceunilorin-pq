<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Save Study Notes — Question and Answer Tags</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0A0F1E;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#131C2E;border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.5);}
.icon{font-size:2.8rem;margin-bottom:14px;}
.title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;margin-bottom:6px;}
.sub{font-size:.82rem;color:#64748B;line-height:1.6;margin-bottom:8px;}
.count{font-size:.82rem;color:#3B82F6;font-weight:700;margin-bottom:28px;}
.q-preview{background:#1A2640;border-radius:12px;padding:12px 14px;margin-bottom:24px;text-align:left;max-height:180px;overflow-y:auto;}
.q-preview::-webkit-scrollbar{width:3px;}
.q-preview::-webkit-scrollbar-thumb{background:#3B82F6;border-radius:100px;}
.q-item{font-size:.74rem;color:#94A3B8;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.q-item:last-child{border-bottom:none;}
.q-num{color:#3B82F6;font-weight:700;}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;margin-bottom:12px;transition:all .2s;}
.btn:active{transform:scale(.98);}
.btn:disabled{background:#1A2640;color:#4A5568;cursor:not-allowed;}
.field{width:100%;padding:14px 16px;background:#1A2640;border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;color:#F1F5F9;font-family:inherit;font-size:.9rem;margin-bottom:12px;}
.field::placeholder{color:#4A5568;}
.login-note{font-size:.72rem;color:#4A5568;margin-bottom:16px;line-height:1.5;}
.success{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:14px;padding:20px 16px;}
.success-icon{font-size:2rem;margin-bottom:8px;}
.success-title{font-family:'Syne',sans-serif;font-weight:800;color:#22C55E;font-size:1rem;margin-bottom:6px;}
.success-sub{font-size:.78rem;color:#64748B;line-height:1.6;}
.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:.8rem;color:#EF4444;font-weight:600;}
.retry{background:transparent;border:1.5px solid rgba(255,255,255,0.08);color:#64748B;border-radius:10px;padding:10px 20px;font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">❓</div>
  <div class="title">The Ultimate Rules of Question and Answer Tags</div>
  <div class="sub">Complete guide to question tags and answer tags</div>
  <div class="count" id="countEl">22 rules ready to save</div>

  <div class="q-preview" id="preview"></div>

  <div id="mainArea">
    <div class="login-note">Sign in with your admin account to save — Firestore rules require it.</div>
    <input class="field" id="emailInput" type="email" placeholder="Admin email" autocomplete="username"/>
    <input class="field" id="passInput" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="btn" id="saveBtn" onclick="signInAndSave()">🔐 Sign In &amp; Save to Firestore</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const SUBJECT = 'english';
const ADMIN_UID = 'KNzxKAqIK7bCXX3YbS8oitSr2wh1';
const TOPIC_ID = 'question-answer-tags';

const TOPIC = {
  title: "The Ultimate Rules of Question and Answer Tags",
  emoji: "❓",
  order: 7,
  subtopics: [
    {
      subtitle: "Introduction to Question Tags",
      content: [
        "<b>Question Tag</b> is formed by combining the auxiliary verb given in a statement with the subject.",
        "<b>Note:</b> The subject should always be converted to pronoun if it is not already in the pronoun form."
      ],
      example: null
    },
    {
      subtitle: "Rule 1: Positive/Negative Statement Rule",
      content: [
        "A <b>positive statement</b> takes a <b>negative question tag</b> while a <b>negative statement</b> takes a <b>positive question tag</b>.",
        "A statement is <b>positive</b> if it does not have words like: <i>not, barely, scarcely, hardly, never, seldom, hardly ever, no longer</i>, or any other negative particle.",
        "✓ <i>Ifeanyi won't travel tomorrow</i> — <b>negative</b> statement (presence of \"n't\")",
        "✓ <i>Lizzy writes exams every week</i> — <b>positive</b> statement (absence of negative particle)"
      ],
      example: null
    },
    {
      subtitle: "Rule 2: Forming Question Tags",
      content: [
        "To form a question tag, the auxiliary verb in the statement is changed to its <b>negative form</b> by adding <b>\"n't\"</b> to it.",
        "However, that is not always the case as there are some question tags that are formed with something entirely different."
      ],
      example: null
    },
    {
      subtitle: "Rule 3: Multiple Auxiliary Verbs",
      content: [
        "If a statement has <b>more than one auxiliary verb</b>, only the <b>one that comes first</b> should be used to form the question tag.",
        "✓ <i>They <b>should</b> have informed me before travelling, <b>shouldn't they</b>?</i>",
        "  Two auxiliary verbs: <b>should</b> and <b>have</b> → use the first one (<b>should</b>)"
      ],
      example: null
    },
    {
      subtitle: "Rule 4: Indefinite Pronouns",
      content: [
        "When indefinite pronouns (<b>someone, somebody, everybody, nobody, everyone, etc.</b>) are used as the subject in a statement, <b>\"they\"</b> is used as their pronoun form in the question tag.",
        "✓ <i>Everybody is here, <b>aren't they</b>?</i>",
        "<b>Note:</b> When indefinite pronouns that end with <b>-thing</b> (nothing, everything, anything, etc.) are used as subjects, <b>\"It\"</b> should be used as their pronoun form.",
        "✓ <i>Everything is fine, <b>isn't it</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 5: 'There' as Subject",
      content: [
        "Anytime <b>\"there\"</b> is used as the subject in a sentence, the <b>\"there\"</b> should be repeated in the question tag.",
        "✓ <i>There aren't many specialists in the country, <b>are there</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 6: No Auxiliary Verb in Statement",
      content: [
        "If a statement <b>doesn't contain any auxiliary verb</b>, use <b>\"do\"</b>, <b>\"does\"</b>, or <b>\"did\"</b> to form the question tag.",
        "<b>Do</b> — when the statement is in present and the subject is <b>plural</b>",
        "<b>Does</b> — when the statement is in present and the subject is <b>singular</b>",
        "<b>Did</b> — when the statement is in the <b>past</b> (subject can be singular or plural)",
        "✓ <i>Fisayo sings melodiously, <b>doesn't she</b>?</i>",
        "  No auxiliary verb → subject is singular → present tense → \"does\""
      ],
      example: null
    },
    {
      subtitle: "Rule 7: Negative Particles",
      content: [
        "Words like <b>barely, scarcely, never, hardly, rarely, nobody, seldom, nothing, etc.</b> are negative particles. Therefore, when any of them are in a statement, the question tag should be <b>positive</b>.",
        "✓ <i>They barely produce first class students in physics department, <b>do they</b>?</i>",
        "  Presence of \"barely\" → question tag must be positive"
      ],
      example: null
    },
    {
      subtitle: "Rule 8: 'Let's' / 'Let us'",
      content: [
        "<b>\"Let's\"</b> is taken as the short form of <b>\"Let us\"</b>. When any of the two starts a sentence, the question tag should be <b>\"shall we\"</b>.",
        "✓ <i>Let's say we agree, <b>shall we</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 9: 'Let me', 'Let her', 'Let him', etc.",
      content: [
        "When a statement begins with <b>\"Let me\"</b>, <b>\"Let her\"</b>, <b>\"Let him\"</b>, etc., the question tag should be <b>\"will you\"</b>.",
        "✓ <i>Let the boy finish his assignment, <b>will you</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 10: Rephrasing Statements",
      content: [
        "There are some statements that need to be <b>rephrased</b> to get the correct question tag. Failure to do this may lead to choosing the wrong answer.",
        "✓ <i>It was Chidinma that slaughtered the chicken, <b>wasn't she</b>?</i>",
        "  Rephrase to: \"Chidinma was the one that slaughtered the chicken\" → \"wasn't she\""
      ],
      example: null
    },
    {
      subtitle: "Rule 11: 'Ought' in Statements",
      content: [
        "If <b>\"ought\"</b> is used <b>without \"not\"</b> as the auxiliary verb → question tag should be <b>\"oughtn't\"</b>",
        "If <b>\"ought\"</b> is used <b>with \"not\"</b> as the auxiliary verb → question tag should be <b>\"should\"</b>",
        "✓ <i>Dr. Alafara ought to come to office tomorrow, <b>oughtn't he</b>?</i>",
        "✓ <i>The girls ought not to have gone there, <b>should they</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 12: Commands",
      content: [
        "If a <b>command</b> is given but the commander is <b>not involved</b> in carrying it out → question tag should be <b>\"will you\"</b>.",
        "✓ <i>Keep your mouth shut, <b>will you</b>?</i>",
        "✓ <i>Take the kid to the hospital, <b>will you</b>?</i>",
        "If the person giving commands <b>is involved</b> in carrying out the command → question tag should be <b>\"shall we\"</b>."
      ],
      example: null
    },
    {
      subtitle: "Rule 13: 'Need' and 'Dare'",
      content: [
        "If <b>\"need\"</b> or <b>\"dare\"</b> is taking the function of an <b>auxiliary verb</b> (used with \"not\"), it should be <b>repeated</b> in the question tag.",
        "✓ <i>Theophilus needn't come with us, <b>need she</b>?</i>",
        "However, when <b>\"need\"</b> or <b>\"dare\"</b> is used as the <b>main verb</b> (used alone or with \"to\"), the question tag should be <b>don't, doesn't, or didn't</b>.",
        "✓ <i>He dared to fight his father, <b>didn't he</b>?</i> (past tense)",
        "✓ <i>They needed some money to buy the stationery, <b>didn't they</b>?</i> (past tense)",
        "✓ <i>The Law students need to work very hard, <b>don't they</b>?</i> (present, plural)",
        "<b>Note:</b> \"need\" or \"dare\" functions as the main verb when it is used alone or when it is used with \"to\" in a statement."
      ],
      example: null
    },
    {
      subtitle: "Rule 14: 'Somebody said that...'",
      content: [
        "If the phrase <b>\"somebody said that...\"</b> begins a statement (where \"somebody\" can be he/she/you/they/I etc.), the question tag should take <b>\"didn't\"</b>.",
        "✓ <i>My mum said that she will go to the market in the evening, <b>didn't she</b>?</i>"
      ],
      example: null
    },
    {
      subtitle: "Rule 15: Phrases to Ignore",
      content: [
        "If any of the following phrases begins a statement, the phrase should <b>not</b> be seen as part of the statement when forming the question tag (except for the transfer of negation):",
        "<i>I know (that), I feel (that), I believe (that), I think (that), I am afraid (that), I agree (that), I suspect (that), It looks as if, It seems (that), It appears (that)</i>",
        "✓ <i>It looks as if Peter will not write the test, <b>will he</b>?</i>",
        "  Remove \"it looks as if\" → \"Peter will not write the test\" → \"will he\""
      ],
      example: null
    },
    {
      subtitle: "Rule 16: 'Has', 'Have', 'Had' as Auxiliary Verbs",
      content: [
        "If a statement contains <b>\"has\"</b>, <b>\"have\"</b>, or <b>\"had\"</b> as the <b>auxiliary verb</b> (helping verb):",
        "1. If it is <b>\"has\"</b> → use <b>\"does\"</b> to form the question tag",
        "2. If it is <b>\"have\"</b> → use <b>\"don't\"</b> to form the question tag",
        "3. If it is <b>\"had\"</b> → use <b>\"didn't\"</b> when forming the question tag",
        "✓ <i>Mr. Thomas has a supermarket, <b>doesn't he</b>?</i> (has is the only verb)",
        "<b>But:</b> If the statement has <b>\"has\"</b>, <b>\"have\"</b>, or <b>\"had\"</b> followed by <b>another verb</b> (a second verb), use the auxiliary verb (has, have, or had) present in the statement.",
        "✓ <i>Sheriff had not eaten since I left home yesterday, <b>had he</b>?</i> (had + eaten → use \"had\")"
      ],
      example: null
    },
    {
      subtitle: "Answer Tags — Introduction",
      content: [
        "Answer tags is a type of answer that is added to a <b>\"yes\"</b> or <b>\"No\"</b> answer."
      ],
      example: null
    },
    {
      subtitle: "Answer Tag Rule 1: Questions Beginning with Auxiliary Verbs",
      content: [
        "If a question begins with an auxiliary verb, the answer tag can either be:",
        "<b>Yes + Pronoun + auxiliary verb without n't</b>",
        "<b>No + Pronoun + auxiliary verb with n't</b>",
        "✓ <i>Did she lend Michaela the pen yesterday?</i> → <b>Yes, she did</b>",
        "✓ <i>Will your mother attend the PTA meeting tomorrow?</i> → <b>No, she won't</b>",
        "✓ <i>Must he always post irrelevant pictures in the group chat?</i> → <b>Yes, he must</b>",
        "<b>Special Note:</b> If a question begins with auxiliary verb <b>\"must\"</b> and a <b>negative answer</b> is to be given, the answer tag will not be \"mustn't\" but instead <b>\"needn't\"</b>.",
        "✓ <i>Must you go to the mosque everyday?</i> → <b>No, I needn't</b>",
        "✓ <i>Must she finish the assignment today?</i> → <b>No, she needn't</b>"
      ],
      example: null
    },
    {
      subtitle: "Answer Tag Rule 2: Affirmative Statements",
      content: [
        "For an <b>affirmative statement that is positive</b>, the answer tag should be:",
        "<b>Yes + reversed positive question tag</b>",
        "For an <b>affirmative statement that is negative</b>, the answer tag should be:",
        "<b>No + reversed negative tag</b>",
        "In an affirmative sentence, the verb in the answer tag will be in the <b>same form</b> as it is in the statement. That is why it is called <b>reverse question tag</b>.",
        "✓ <i>Mr. Adeleke has three private jets.</i> → <b>Yes, he does</b>",
        "✓ <i>It was Chiwendu that paid the money.</i> → <b>Yes, she was</b>",
        "✓ <i>He didn't sense his mother's presence in the room.</i> → <b>No, he didn't</b>",
        "✓ <i>Oluchi hardly visit her father.</i> → <b>No, she doesn't</b>",
        "<b>Note:</b> \"Hardly\" is a negative participle. In question tag, the question tag would be \"does\" but in answer tag, the answer tag will be in the same form as the one in the statement → \"No, she doesn't\"."
      ],
      example: null
    },
    {
      subtitle: "Answer Tag Rule 3: Statement and Question Tag",
      content: [
        "If given <b>both a statement and its question tag</b>, the answer tag should depend on the <b>statement</b>:",
        "If the statement is <b>positive</b> → answer tag should be <b>positive</b> (Yes + reverse positive question tag)",
        "If the statement is <b>negative</b> → answer tag should be <b>negative</b> (No + reversed negative question tag)",
        "✓ <i>She is Mr. Bello's son, isn't she?</i> → <b>Yes, she is</b>",
        "✓ <i>He needn't sell his only car, need he?</i> → <b>No, he needn't</b>"
      ],
      example: null
    }
  ]
};

  apiKey: "AIzaSyA8vqQqgQYzSX5qagQz1_8BB87xURMsgPE",
  authDomain: "aceunilorin-pq.firebaseapp.com",
  projectId: "aceunilorin-pq",
  storageBucket: "aceunilorin-pq.firebasestorage.app",
  messagingSenderId: "152163357125",
  appId: "1:152163357125:web:23dc8652f9789197623bac"

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const prev = document.getElementById('preview');
prev.innerHTML = TOPIC.subtopics.map((s,i) =>
  `<div class="q-item"><span class="q-num">${i+1}.</span> ${s.subtitle}</div>`
).join('');

async function fsSet(col, docId, data, attempt = 1) {
  try {
    await db.collection(col).doc(docId).set({...data, updatedAt: new Date().toISOString()}, {merge: true});
  } catch (err) {
    const isNetworkError = err.code === 'unavailable' || err instanceof TypeError;
    if (isNetworkError && attempt < 3) {
      await new Promise(res => setTimeout(res, attempt * 1000));
      return fsSet(col, docId, data, attempt + 1);
    }
    throw err;
  }
}

async function signInAndSave() {
  const btn = document.getElementById('saveBtn');
  const area = document.getElementById('mainArea');
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;

  if (!email || !password) {
    alert('Enter your admin email and password first.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '🔐 Signing in...';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    if (cred.user.uid !== ADMIN_UID) {
      area.innerHTML = `
        <div class="error">🚫 Signed in, but this account is not the admin account. Nothing was saved.</div>
        <button class="retry" onclick="location.reload()">Try again</button>`;
      return;
    }
  } catch (err) {
    area.innerHTML = `
      <div class="error">🚫 Sign-in failed: ${err.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  try {
    await fsSet(`studynotes/${SUBJECT}/topics`, TOPIC_ID, TOPIC);
    document.getElementById('mainArea').innerHTML = `
      <div class="success">
        <div class="success-icon">🎉</div>
        <div class="success-title">Topic saved!</div>
        <div class="success-sub">"${TOPIC.title}" is now live under studynotes/${SUBJECT}/topics/${TOPIC_ID}, with ${TOPIC.subtopics.length} sub-sections.</div>
      </div>`;
  } catch (e) {
    document.getElementById('mainArea').innerHTML = `
      <div class="error">❌ Failed to save: ${e.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
  }
}
</script>
