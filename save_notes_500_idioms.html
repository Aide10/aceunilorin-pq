async function fsSet(col, docId, data, attempt = 1) {
  try {
    await db.collection(col).doc(docId).set({...data, updatedAt: new Date().toISOString()}, {merge: true});
  } catch (err) {
    const isNetworkError = err.code === 'unavailable' || err instanceof TypeError;
    if (isNetworkError && attempt < 3) {
      await new Promise(res => setTimeout(res, attempt * 1000));
      return fsSet(col, docId, data, attempt + 1);
    }
    throw err;
  }
}

async function signInAndSave() {
  const btn = document.getElementById('saveBtn');
  const area = document.getElementById('mainArea');
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;

  if (!email || !password) {
    alert('Enter your admin email and password first.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '🔐 Signing in...';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    if (cred.user.uid !== ADMIN_UID) {
      area.innerHTML = `
        <div class="error">🚫 Signed in, but this account is not the admin account. Nothing was saved.</div>
        <button class="retry" onclick="location.reload()">Try again</button>`;
      return;
    }
  } catch (err) {
    area.innerHTML = `
      <div class="error">🚫 Sign-in failed: ${err.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  try {
    await fsSet(`studynotes/${SUBJECT}/topics`, TOPIC_ID, TOPIC);
    document.getElementById('mainArea').innerHTML = `
      <div class="success">
        <div class="success-icon">🎉</div>
        <div class="success-title">Topic saved!</div>
        <div class="success-sub">"${TOPIC.title}" is now live under studynotes/${SUBJECT}/topics/${TOPIC_ID}, with ${TOPIC.subtopics.length} sub-sections.</div>
      </div>`;
  } catch (e) {
    document.getElementById('mainArea').innerHTML = `
      <div class="error">❌ Failed to save: ${e.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
  }
}
