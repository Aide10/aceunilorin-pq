async function fsAdd(col, data, attempt = 1) {
  try {
    await db.collection(col).add({...data, createdAt: new Date().toISOString()});
  } catch (err) {
    const isNetworkError = err.code === 'unavailable' || err instanceof TypeError;
    if (isNetworkError && attempt < 3) {
      await new Promise(res => setTimeout(res, attempt * 1000));
      return fsAdd(col, data, attempt + 1);
    }
    throw err;
  }
}

async function signInAndSave() {
  const btn = document.getElementById('saveBtn');
  const area = document.getElementById('mainArea');
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;

  if (!email || !password) {
    alert('Enter your admin email and password first.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '🔐 Signing in...';

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    if (cred.user.uid !== ADMIN_UID) {
      area.innerHTML = `
        <div class="error">🚫 Signed in, but this account is not the admin account (UID mismatch). Nothing was saved.</div>
        <button class="retry" onclick="location.reload()">Try again</button>`;
      return;
    }
  } catch (err) {
    area.innerHTML = `
      <div class="error">🚫 Sign-in failed: ${err.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  if (navigator.onLine === false) {
    area.innerHTML = `
      <div class="error">📡 Your device shows no internet connection right now.</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  area.innerHTML = `<div class="progress-text" id="pText">Checking current highest question number...</div>`;

  let startNumber = 1;
  try {
    const col = `studyquestions/${SUBJECT}/questions`;
    const snap = await db.collection(col).orderBy('number', 'desc').limit(1).get();
    if (!snap.empty) {
      startNumber = (snap.docs[0].data().number || 0) + 1;
    }
  } catch (e) {
    area.innerHTML = `
      <div class="error">❌ Could not check existing question numbers: ${e.message}</div>
      <button class="retry" onclick="location.reload()">Try again</button>`;
    return;
  }

  area.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="pFill" style="width:0%"></div></div>
      <div class="progress-text" id="pText">Saving 0 of ${QUESTIONS.length}... (starting at #${startNumber})</div>
    </div>`;

  let saved = 0;
  for (const q of QUESTIONS) {
    try {
      const number = startNumber + saved;
      await fsAdd(`studyquestions/${SUBJECT}/questions`, {...q, number, topicId: TOPIC_ID});
      saved++;
      const pct = Math.round((saved / QUESTIONS.length) * 100);
      document.getElementById('pFill').style.width = pct + '%';
      document.getElementById('pText').textContent = `Saving ${saved} of ${QUESTIONS.length}... (${pct}%)`;
    } catch(e) {
      document.getElementById('mainArea').innerHTML = `
        <div class="error">❌ Failed at "${q.question.substring(0,40)}...": ${e.message}</div>
        <div class="error" style="background:rgba(59,130,246,0.08);border-color:rgba(59,130,246,0.2);color:#94A3B8;">
          ✅ ${saved} questions were saved before the error.
        </div>
        <button class="retry" onclick="location.reload()">Try again</button>`;
      return;
    }
  }

  document.getElementById('mainArea').innerHTML = `
    <div class="success">
      <div class="success-icon">🎉</div>
      <div class="success-title">All ${saved} questions saved!</div>
      <div class="success-sub">Appended as #${startNumber} through #${startNumber + saved - 1} in studyquestions/${SUBJECT}/questions.</div>
    </div>`;
}
