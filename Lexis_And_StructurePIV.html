<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AceUnilorin PQ — JAMB Grammar Mock</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2c; --panel2:#0f1626;
    --blue:#3b82f6; --blue-soft:#60a5fa; --blue-dim:#1e3a5f;
    --text:#e8ecf5; --muted:#8b93a7; --line:#232c42;
    --good:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:20;
  }
  .brand{font-size:22px; font-weight:800; letter-spacing:-0.3px;}
  .brand .ace{color:var(--blue-soft);}
  .brand .uni{color:var(--text);}
  .brand .pq{color:var(--blue-soft);}
  .theme-dot{width:34px; height:34px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:16px; border:1px solid var(--line);}

  .wrap{max-width:640px; margin:0 auto; padding:16px 16px 60px;}

  .meta-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--panel); border-radius:12px; margin-bottom:14px;
  }
  .timer{font-size:22px; font-weight:800; color:var(--blue-soft); display:flex; align-items:center; gap:8px;}
  .timer.warn{color:#fca5a5;}
  .answered-count{font-size:13px; color:var(--muted);}

  .rail{height:5px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-bottom:16px;}
  .rail-fill{height:100%; background:var(--blue); width:0%; transition:width .3s ease;}

  .qhead{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .qcounter{color:var(--blue-soft); font-weight:700; font-size:14px;}
  .pill{
    display:inline-block; padding:4px 12px; border:1px solid var(--blue-dim);
    border-radius:20px; font-size:12px; color:var(--blue-soft); background:rgba(59,130,246,0.08);
  }

  .card{background:var(--panel); border-radius:16px; padding:22px 18px; margin-bottom:16px;}
  .qtext{font-size:18px; font-weight:700; line-height:1.5; margin:0 0 20px; color:var(--text);}

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:flex-start; gap:14px;
    padding:16px; border-radius:12px; background:var(--panel2);
    border:1.5px solid transparent; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--blue-dim);}
  .opt.selected{border-color:var(--blue); background:rgba(59,130,246,0.12);}
  .opt .badge{
    min-width:34px; height:34px; border-radius:9px; background:#1c2540;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:var(--text);
  }
  .opt.selected .badge{background:var(--blue); color:#fff;}
  .opt .otext{font-size:15.5px; line-height:1.4; color:var(--text); padding-top:6px;}

  .nav-row{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; padding:14px; border-radius:12px; border:none; font-weight:700; font-size:15px;
    cursor:pointer; transition:opacity .15s, transform .1s; text-align:center;
  }
  .btn:active{transform:translateY(1px);}
  .btn.prev{background:var(--panel2); color:var(--muted);}
  .btn.prev:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.next{background:var(--panel2); color:var(--text);}
  .btn.submit{background:var(--blue); color:#fff;}

  .navigator{background:var(--panel); border-radius:16px; padding:18px; margin-top:16px;}
  .navigator-title{font-size:12px; letter-spacing:0.5px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; font-weight:700;}
  .grid{display:grid; grid-template-columns:repeat(8,1fr); gap:8px;}
  @media (max-width:420px){ .grid{grid-template-columns:repeat(6,1fr);} }
  .cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:9px; background:var(--panel2); color:var(--muted); font-size:11px; font-weight:600; cursor:pointer;
  }
  .cell.answered{background:var(--blue); color:#fff;}
  .cell.current{outline:2px solid var(--blue-soft); outline-offset:1px;}

  .hidden{display:none !important;}

  .intro{background:var(--panel); border-radius:16px; padding:30px 22px; text-align:center;}
  .intro h1{font-size:21px; margin-bottom:16px; color:var(--text);}
  .intro-stats{display:flex; justify-content:center; gap:24px; margin-bottom:24px; flex-wrap:wrap;}
  .intro-stats div{text-align:center;}
  .intro-stats .n{font-size:24px; font-weight:800; color:var(--blue-soft);}
  .intro-stats .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .start-btn{background:var(--blue); color:#fff; border:none; padding:14px 36px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;}

  .score-hero{text-align:center; padding:36px 20px; background:var(--panel); border-radius:16px; margin-bottom:20px;}
  .score-hero .big{font-size:46px; font-weight:800; color:var(--blue-soft); line-height:1; margin-bottom:8px;}
  .score-hero .sub{font-size:14px; color:var(--muted);}
  .verdict{display:inline-block; margin-top:14px; padding:6px 16px; border:1px solid var(--blue-dim); border-radius:20px; font-size:12px; color:var(--blue-soft); background:rgba(59,130,246,0.08); font-weight:700;}

  .breakdown{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:22px;}
  .bd-card{background:var(--panel); border-radius:12px; padding:14px; text-align:center;}
  .bd-card .cat{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:6px; font-weight:700;}
  .bd-card .frac{font-size:19px; font-weight:800; color:var(--blue-soft);}

  .review-item{background:var(--panel); border-radius:12px; border-left:3px solid var(--bad); padding:16px; margin-bottom:10px;}
  .review-item .rq{font-weight:700; margin-bottom:8px; color:var(--text); font-size:14.5px;}
  .review-item .rline{font-size:13px; margin:4px 0;}
  .review-item .ryour{color:#fca5a5;}
  .review-item .rcorrect{color:#86efac;}

  .section-title{font-size:12px; letter-spacing:0.5px; text-transform:uppercase; color:var(--muted); font-weight:700; margin:26px 0 12px;}
  .footer-credit{text-align:center; font-size:11px; color:var(--muted); margin-top:26px;}
</style>
</head>
