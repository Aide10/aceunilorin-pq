<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA8vqQqgQYzSX5qagQz1_8BB87xURMsgPE",
    authDomain: "aceunilorin-pq.firebaseapp.com",
    projectId: "aceunilorin-pq",
    storageBucket: "aceunilorin-pq.firebasestorage.app",
    messagingSenderId: "152163357125",
    appId: "1:152163357125:web:23dc8652f9789197623bac",
    measurementId: "G-PQ1H0EWQ2L"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  let userIsPremium = false;
  let freebiesLoaded = false;
  let currentUser = null; // Add this to track user

  // =========================
  // THEME
  // =========================
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    
    // Fix: Check if theme-toggle element exists before setting
    const themeToggle = document.querySelector('.theme-toggle');
    if (themeToggle) {
      themeToggle.textContent = isDark ? '🌙' : '☀️';
    }
    
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  
  // Fix: Check if theme-toggle element exists
  const themeToggle = document.querySelector('.theme-toggle');
  if (themeToggle) {
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }

  // =========================
  // GREETING
  // =========================
  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning,';
    if (h < 17) return 'Good afternoon,';
    return 'Good evening,';
  }

  const greetingElement = document.getElementById('greeting');
  if (greetingElement) {
    greetingElement.textContent = getGreeting();
  }

  // =========================
  // PAGE SWITCHING
  // =========================
  function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
    });

    document.querySelectorAll('.nav-item').forEach(n => {
      n.classList.remove('active', 'active-green');
    });

    const targetPage = document.getElementById('page-' + page);
    if (targetPage) {
      targetPage.classList.add('active');
    }

    const navEl = document.getElementById('nav-' + page);
    if (navEl) {
      navEl.classList.add(
        page === 'freebies' ? 'active-green' : 'active'
      );
    }

    if (page === 'freebies' && !freebiesLoaded) {
      loadFreebies();
    }
  }

  // =========================
  // AUTH
  // =========================
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }

    currentUser = user; // Store current user

    try {
      // =========================
      // USER DATA
      // =========================
      const userDoc = await db
        .collection('users')
        .doc(user.uid)
        .get();

      const data = userDoc.data() || {};
      const firstName = data.fullName
        ? data.fullName.split(' ')[0]
        : user.displayName || 'Student';

      const userNameElement = document.getElementById('userName');
      if (userNameElement) {
        userNameElement.textContent = firstName + '!';
      }

      userIsPremium = data.isPremium || false;

      // =========================
      // PREMIUM UI
      // =========================
      if (userIsPremium) {
        const badge = document.getElementById('userBadge');
        if (badge) {
          badge.textContent = '⭐ Premium';
          badge.style.background = 'rgba(245,158,11,0.25)';
        }
        
        const upgradeBanner = document.getElementById('upgradeBanner');
        if (upgradeBanner) {
          upgradeBanner.classList.add('hidden');
        }
      }

      // =========================
      // USER STATS
      // =========================
      const statsDoc = await db
        .collection('userStats')
        .doc(user.uid)
        .get();

      if (statsDoc.exists) {
        const stats = statsDoc.data() || {};
        
        const statMocks = document.getElementById('statMocks');
        if (statMocks) {
          statMocks.textContent = stats.mocksTaken || 0;
        }
        
        const statBest = document.getElementById('statBest');
        if (statBest) {
          statBest.textContent = stats.bestScore ? stats.bestScore + '%' : '—';
        }
      }

      // =========================
      // LAST MOCK SCORE
      // =========================
      const lastResult = JSON.parse(localStorage.getItem('mockResult'));
      if (lastResult) {
        const pct = Math.round(lastResult.correct * 2);
        let color = '#EF4444';
        
        if (pct === 100) color = '#A855F7';
        else if (pct >= 90) color = '#22C55E';
        else if (pct >= 80) color = '#3B82F6';
        else if (pct >= 70) color = '#06B6D4';
        else if (pct >= 60) color = '#F59E0B';
        else if (pct >= 50) color = '#F97316';

        const lastScoreContent = document.getElementById('lastScoreContent');
        if (lastScoreContent) {
          lastScoreContent.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:14px;">
                <svg class="score-ring-sm" viewBox="0 0 56 56">
                  <circle cx="28" cy="28" r="22" fill="none" stroke="var(--surface2)" stroke-width="5"/>
                  <circle cx="28" cy="28" r="22" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${2 * Math.PI * 22}" stroke-dashoffset="${2 * Math.PI * 22 * (1 - pct / 100)}" transform="rotate(-90 28 28)"/>
                  <text x="28" y="33" text-anchor="middle" font-size="11" font-weight="800" fill="${color}" font-family="Syne,sans-serif">${pct}%</text>
                </svg>
                <div>
                  <div style="font-family:Syne,sans-serif;font-size:0.9rem;font-weight:700;">Mock Exam</div>
                  <div style="font-size:0.76rem;color:var(--text-muted);">${lastResult.correct} correct · ${lastResult.wrong} wrong</div>
                </div>
              </div>
              <a href="results.html" class="view-link">View →</a>
            </div>
          `;
        }
      }

      // =========================
      // LOAD OTHER DATA
      // =========================
      loadLeaderboard();
      loadUserRank(user.uid);

    } catch (err) {
      console.error('Auth state change error:', err);
      const userNameElement = document.getElementById('userName');
      if (userNameElement) {
        userNameElement.textContent = 'Student!';
      }
    }
  });

  // =========================
  // LOAD FREEBIES (FIXED RACE CONDITION)
  // =========================
  async function loadFreebies() {
    freebiesLoaded = true;

    try {
      // Wait for auth with better handling
      let attempts = 0;
      while (!auth.currentUser && attempts < 20) { // Increased attempts
        await new Promise(r => setTimeout(r, 200));
        attempts++;
      }

      // Fix: Check premium status from current user data instead of global variable
      if (!auth.currentUser) {
        console.error('No user authenticated');
        return;
      }

      // Get fresh user data to ensure premium status is correct
      const userDoc = await db
        .collection('users')
        .doc(auth.currentUser.uid)
        .get();
      
      const isUserPremium = userDoc.exists ? (userDoc.data().isPremium || false) : false;

      if (!isUserPremium) {
        const freebiesLocked = document.getElementById('freebiesLocked');
        if (freebiesLocked) {
          freebiesLocked.style.display = 'block';
        }
        return;
      }

      // SHOW PREMIUM CONTENT
      const freebiesContent = document.getElementById('freebiesContent');
      if (freebiesContent) {
        freebiesContent.style.display = 'block';
      }

      // FETCH CONFIG
      const premiumDoc = await db
        .collection('config')
        .doc('premium')
        .get();

      const data = premiumDoc.data() || {};

      // WHATSAPP LINK
      if (data.whatsappLink) {
        const whatsappBtn = document.getElementById('whatsappBtn');
        if (whatsappBtn) {
          whatsappBtn.href = data.whatsappLink;
        }
      }

      // FREEBIES
      const freebies = data.freebies || [];

      if (freebies.length === 0) {
        const freebiesLoading = document.getElementById('freebiesLoading');
        if (freebiesLoading) {
          freebiesLoading.innerHTML = '<p>No resources yet. Check back soon!</p>';
        }
        return;
      }

      const icons = ['📄', '📕', '📗', '📘', '📙', '📃', '🗂️', '📋', '📑', '🧾'];
      let html = '';

      freebies.forEach((item, i) => {
        const icon = icons[i % icons.length];
        const entries = Object.entries(item);
        if (!entries.length) return;
        
        const title = entries[0][0];
        const link = entries[0][1];

        html += `
          <a href="${link}" target="_blank" class="freebie-card">
            <div class="freebie-icon">${icon}</div>
            <div class="freebie-info">
              <div class="freebie-title">${title}</div>
              <div class="freebie-desc">Tap to open in Google Drive</div>
            </div>
            <div class="freebie-arrow">→</div>
          </a>
        `;
      });

      const freebiesLoading = document.getElementById('freebiesLoading');
      const freebiesGrid = document.getElementById('freebiesGrid');
      
      if (freebiesLoading) {
        freebiesLoading.style.display = 'none';
      }
      
      if (freebiesGrid) {
        freebiesGrid.style.display = 'flex';
        freebiesGrid.innerHTML = html;
      }

    } catch (err) {
      console.error('Load freebies error:', err);
      const freebiesLoading = document.getElementById('freebiesLoading');
      if (freebiesLoading) {
        freebiesLoading.innerHTML = '<p>Failed to load resources. Try again later.</p>';
      }
    }
  }

  // =========================
  // LEADERBOARD
  // =========================
  async function loadLeaderboard() {
    try {
      const snap = await db
        .collection('leaderboard')
        .orderBy('bestScore', 'desc')
        .limit(5)
        .get();

      if (snap.empty) return;

      const medals = ['gold', 'silver', 'bronze', '', ''];
      let html = '';

      snap.docs.forEach((doc, i) => {
        const d = doc.data() || {};
        const initial = d.username ? d.username[0].toUpperCase() : '?';

        html += `
          <div class="lb-row">
            <div class="lb-rank ${medals[i]}">
              ${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}
            </div>
            <div class="lb-avatar">${initial}</div>
            <div class="lb-info">
              <div class="lb-username">@${d.username || 'unknown'}</div>
              <div class="lb-meta">${d.mocksTaken || 0} mock${d.mocksTaken !== 1 ? 's' : ''}</div>
            </div>
            <div class="lb-score">${d.bestScore || 0}%</div>
          </div>
        `;
      });

      const leaderboardList = document.getElementById('leaderboardList');
      if (leaderboardList) {
        leaderboardList.innerHTML = html;
      }

    } catch (err) {
      console.error('Leaderboard error:', err);
    }
  }

  // =========================
  // USER RANK
  // =========================
  async function loadUserRank(uid) {
    try {
      const snap = await db
        .collection('leaderboard')
        .orderBy('bestScore', 'desc')
        .get();

      const idx = snap.docs.findIndex(d => d.id === uid);
      if (idx !== -1) {
        const statRank = document.getElementById('statRank');
        if (statRank) {
          statRank.textContent = '#' + (idx + 1);
        }
      }
    } catch (err) {
      console.error('User rank error:', err);
    }
  }

  // =========================
  // LOGOUT (FIXED WITH ERROR HANDLING)
  // =========================
  async function handleLogout() {
    try {
      await auth.signOut();
      window.location.href = 'auth.html';
    } catch (err) {
      console.error('Logout error:', err);
      // Optionally show user feedback
      alert('Error logging out. Please try again.');
    }
  }

  // =========================
  // COMING SOON TOAST (FIXED)
  // =========================
  function showComingSoon() {
    let toast = document.getElementById('comingSoonToast');
    
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'comingSoonToast';
      toast.style.cssText = `
        position:fixed;
        bottom:80px;
        left:50%;
        transform:translateX(-50%) translateY(20px);
        background:#1E293B;
        border:1px solid rgba(34,197,94,0.3);
        color:#22C55E;
        padding:10px 20px;
        border-radius:100px;
        font-size:0.82rem;
        font-weight:700;
        z-index:999;
        transition:all 0.3s;
        opacity:0;
        white-space:nowrap;
        box-shadow:0 8px 24px rgba(0,0,0,0.4);
      `;
      toast.textContent = '📖 Study Notes — Coming Soon!';
      document.body.appendChild(toast);
    }

    // Force reflow
    toast.offsetHeight;
    
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(20px)';
    }, 2500);
  }
            </script>
